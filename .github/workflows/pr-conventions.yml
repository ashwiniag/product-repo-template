name: pr-conventions

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions: {}

jobs:
  conventions:
    name: conventions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Branch name
        env:
          BRANCH: ${{ github.head_ref }}
        run: scripts/check-branch-name.sh "$BRANCH"
      - name: PR title (becomes the commit message on main)
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: scripts/check-commit-msg.sh --text "$TITLE"
