# Add a gomod entry once the repo has a go.mod.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7  # let new releases settle before adopting them
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope
    groups:
      pre-commit-hooks:
        patterns: ["*"]
